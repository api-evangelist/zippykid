source: https://my.pressable.com/documentation/api/v1/webhooks.md
spec_type: Webhooks
description: >-
  Pressable webhooks notify a subscriber URL when events occur in the My Pressable
  Control Panel. Register a webhook URL to subscribe. Events are delivered only
  while the account has an active webhook endpoint. Event names use snake_case
  (e.g. site_created, git_deploy_completed).
delivery:
  subscription: Register a webhook URL in the control panel / via the API.
  transport: HTTP POST to the subscriber URL
