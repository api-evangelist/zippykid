      x-operation-id-source: derived
  /zones/{zone_id}/records/{id}:
    delete:
      tags:
      - Zones
      summary: Delete Record
      description: Delete a DNS record from a zone.
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    example:
                      id: 6
                      created: '2022-02-18T16:49:40.000Z'
                      updated: '2022-02-18T16:49:40.000Z'
                      name: newdomain.com
                      records:
                      - id: 37
                        zoneId: 6
                        primary: false
                        type: A
                        name: www
                        value: 199.16.172.38
                        priority: null
                        weight: null
                        port: null
                        ttl: 3600
                        siteId: 1
                        created: '2022-02-18T16:49:40.000Z'
                      - id: 39
                        zoneId: 6
                        primary: false
                        type: CNAME
                        name: newsite2
                        value: newsite2.
                        priority: null
                        weight: null
                        port: null
                        ttl: 0
                        siteId: null
                        created: '2022-02-21T17:21:57.000Z'
      operationId: deleteZonesByZoneIdRecordsById
      x-operation-id-source: derived
  /zones/{zone_id}/providers:
    post:
      tags:
      - Zones
      summary: Generate Email Provider Records
      description: Generate all the email records for popular providers. The records will be attached to the requested zone.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
      operationId: postZonesByZoneIdProviders
      x-operation-id-source: derived
  /zones/{zone_id}/records/{id}/ssl:
    get:
      tags:
      - Zones
      summary: SSL Certificate Details
      description: Returns the SSL certificate details for an A Record.
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No information found
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - No information found
      operationId: getZonesByZoneIdRecordsByIdSsl
      x-operation-id-source: derived
    put:
      tags:
      - Zones
      summary: Retry SSL Certificate Provisioning
      description: Forces a retry of SSL certificate provisioning of A Records. This is a way to make sure SSL for an A Record is reprovisioned if it is not working properly.
      parameters:
      - in: path
        name: zone_id
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: There was a problem processing your request.
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - SSL can only be retried on A records
      operationId: putZonesByZoneIdRecordsByIdSsl
      x-operation-id-source: derived
