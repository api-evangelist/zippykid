                      version: ''
                      update_version: null
                    - name: object-cache.php
                      title: Memcached
                      description: External object cache.
                      status: dropin
                      update: none
                      version: ''
                      update_version: null
    post:
      tags:
      - sites
      summary: Install and Activate Plugins
      description: To enhance your WordPress site, install and activate plugins to add new features, functionality, and customization options effortlessly.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      version:
                        type: string
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
    put:
      tags:
      - sites
      summary: Update Plugins
      description: Regularly updating plugins is crucial for WordPress sites to ensure optimal performance, security, and compatibility with the latest features and enhancements.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      version:
                        type: string
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
    delete:
      tags:
      - sites
      summary: Delete Plugins
      description: Deleting unnecessary plugins from WordPress sites enhances performance, reduces security risks, and minimizes conflicts, resulting in a streamlined and efficient website environment.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
  /sites/{id}/plugins/deactivate:
    put:
      tags:
      - sites
      summary: Deactivate Plugins
      description: Deactivating plugins on WordPress sites allows for troubleshooting, prevents conflicts, and temporarily disables specific functionalities without removing the plugin entirely.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
  /sites/{id}/plugins/activate:
    put:
      tags:
      - sites
      summary: Activate Plugins
      description: Activating previously deactivated plugins restores desired functionalities, expands features, and re-enables customizations.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
  /sites/{id}/security-alerts/plugins:
    get:
      tags:
      - sites
      summary: Plugin Alerts
      description: Get a list of plugins reporting security issues
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    example:
                      active:
                      - id: 1126
                        site_id: 4
                        name: redirection
                        version: '1.1'
                        status: active
                        active: true
                        update_available: false
                        update_version: null
                        security_risk: true
                        security_alerts:
                        - title: Redirection <= 3.6.2 - Cross-Site Request Forgery (CSRF)
                          description: The Redirection WordPress plugin was affected by a Cross-Site Request Forgery (CSRF) security vulnerability.
                          severity: null
                          fixed_in: 3.6.3
                          reference_urls:
                          - https://www.ripstech.com/php-security-calendar-2018/
                          - https://plugins.trac.wordpress.org/changeset/1974375/redirection
                        - title: Redirection < 2.8 - Authenticated Local File Inclusion
                          description: The Redirection WordPress plugin was affected by an Authenticated Local File Inclusion security vulnerability.
                          severity: null
                          fixed_in: '2.8'
