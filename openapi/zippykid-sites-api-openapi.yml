  /sites/{id}/maintenance-mode:
    put:
      tags:
      - sites
      summary: Maintenance Mode
      description: The "Maintenance Mode" feature offers a toggle to either enable or disable a protective mode for your website. Enabling it activates the Pressable Maintenance Mode plugin, which ensures your WP Admin remains accessible to you while displaying a Maintenance Mode screen to your site's visitors, thus barring them from interaction while you perform any needed updates or adjustments behind the scenes. Conversely, disabling it makes your website fully accessible and interactive for visitors, so it is vital to ensure all updates and changes are finalized for a seamless user experience before deactivating this mode.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
  /sites/{id}/basic-authentication:
    put:
      tags:
      - sites
      summary: Basic Authentication
      description: The "Basic Authentication" feature allows you to easily restrict public access to your website. When installed, it activates the Pressable Basic Authentication plugin, which requires anyone visiting your site to enter a username and password before gaining access. This is especially useful for in-progress development sites where you want to keep content private. Removing the Basic Authentication plugin removes this login requirement, making your site fully open to the public. Be sure all content is production-ready before turning it off to ensure a professional experience for your audience.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
  /sites/{id}/wordpress-mcp:
    put:
      tags:
      - sites
      summary: WordPress MCP
      description: The "WordPress MCP" feature toggles the WordPress MCP plugin on a per-site basis. When activated, the Pressable WordPress MCP plugin is installed and enabled, exposing the site to Model Context Protocol clients. Deactivating removes the plugin and disables MCP access for the site. The endpoint flips the toggle each time it is called — one call enables, the next disables.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: MCP plugin enabled
                  data:
                    type: object
                    example:
                      mcp_enabled: true
  /sites/{site_id}/file-modifications:
    get:
      tags:
      - sites
      summary: File Modification Settings
      description: Returns the current state of the wp-config file-modification constants for a site. ‘disallow_file_edit’ reports the DISALLOW_FILE_EDIT constant (hides the built-in plugin & theme code editor in the WordPress admin) and ‘disallow_file_mods’ reports the DISALLOW_FILE_MODS constant (also blocks plugin/theme installs, updates, and deletions).
      parameters:
      - in: path
        name: site_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    example:
                      disallow_file_edit: true
                      disallow_file_mods: false
    put:
      tags:
      - sites
      summary: Update File Modification Settings
      description: Sets or removes a wp-config file-modification constant for a site. When ‘enabled’ is true the constant is defined as ‘true’ in the site’s wp-config.php; when false the constant is removed. Removing an already-absent constant succeeds, so the disable path is idempotent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                constant:
                  type: string
                enabled:
                  type: boolean
      parameters:
      - in: path
        name: site_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: DISALLOW_FILE_EDIT enabled
                  data:
                    type: object
                    example:
                      disallow_file_edit: true
                      disallow_file_mods: false
