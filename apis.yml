aid: zippykid
name: ZippyKid
description: >-
  ZippyKid is the company behind Pressable, a managed WordPress hosting platform
  now operated as an Automattic brand and built on Automattic's WP Cloud
  infrastructure. Surfaced as a 500 Global portfolio company and added to the API
  Evangelist network, Pressable delivers managed WordPress hosting with
  autoscaling, a global CDN, Jetpack Security, daily backups, and SSH/Git/WP-CLI
  access. For developers and agencies it exposes a full OAuth 2.0 REST API (v1)
  covering sites, domains, DNS zones, Git deploys, plugins, themes, edge cache
  and collaborators; 66 webhook events; and a published remote MCP server (75+
  tools) for AI-driven site management from Claude, Gemini CLI and ChatGPT.
